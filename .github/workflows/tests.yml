jobs:
  test:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: 'Install dependencies (Yarn)'
        run: 'yarn'
      - name: 'Tests'
        run: |
          set +e
          yarn test --report json > test-output.jsonl 2> test-output.err
          test_exit=$?
          if [ "$test_exit" -ne 0 ] && [ ! -s test-output.jsonl ]; then
            echo "yarn test failed before producing JSON output:"
            cat test-output.err
            exit "$test_exit"
          fi
          while IFS= read -r line; do
            jq -r '
              if .event == "runStart" then "Running \(.testCount) tests (fuzz: \(.fuzzRuns), seed: \(.initialSeed))\n"
              elif .event == "testCompleted" then
                (if .status == "pass" then "  ✓ " else "  ✗ " end) + (.labels | join(" > ")) + " (\(.duration)ms)" +
                (if .failures != [] then "\n" + (.failures | map("    " + .) | join("\n")) else "" end)
              elif .event == "runComplete" then "\nPassed: \(.passed), Failed: \(.failed), Duration: \(.duration)ms"
              else empty end
            ' <<< "$line"
          done < test-output.jsonl
          exit "$test_exit"
name: 'Tests'
'on':
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'
permissions:
  contents: 'read'
