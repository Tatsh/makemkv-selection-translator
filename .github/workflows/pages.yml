---
concurrency:
  cancel-in-progress: false
  group: pages
jobs:
  pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.yarn/berry
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install dependencies
        run: yarn
      - name: Build
        run: yarn build:ci
      - name: Prepare artifact
        run: |
          mkdir -p deploy
          cp index.html main.js github-fork-ribbon.min.js deploy/
          sha="$GITHUB_SHA"
          short_sha="${sha:0:7}"
          deploy_label="Commit: <a href=\"https://github.com/${GITHUB_REPOSITORY}/commit/${sha}\">${short_sha}</a>"
          sed -i "s|__DEPLOY_LABEL__|${deploy_label}|g" deploy/index.html
          deploy_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          sed -i "s|__DEPLOY_DATE__|${deploy_date}|g" deploy/index.html
      - if: ${{ github.run_attempt != '1' }}
        name: Delete stale github-pages artifacts from prior attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
          while read -r id; do
            echo "Deleting prior github-pages artifact ${id}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{github.workspace}}/deploy
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
name: GitHub Pages
'on':
  push:
    branches: [master]
permissions:
  actions: write
  contents: read
  id-token: write
  pages: write
